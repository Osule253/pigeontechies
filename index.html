<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Pigeon Techies | Web Development & Digital Technology in Kenya
    </title>

    <meta
      name="description"
      content="Pigeon Techies is a digital technology studio in Kenya creating modern websites, web applications, software and digital solutions for businesses and organizations."
    />

    <meta
      name="keywords"
      content="Pigeon Techies, PigeonTechies, web development Kenya, web development Nairobi, website design Kenya, software development Kenya, web applications Kenya, digital technology Kenya, software company Nairobi"
    />

    <meta name="author" content="Pigeon Techies" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="googlebot" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://pigeontechies.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#070707"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Pigeon Techies"
    />

    <meta
      property="og:title"
      content="Pigeon Techies | Web Development & Digital Technology in Kenya"
    />

    <meta
      property="og:description"
      content="Modern websites, web applications, software and digital technology solutions by Pigeon Techies."
    />

    <meta
      property="og:url"
      content="https://pigeontechies.com/"
    />

    <meta
      property="og:image"
      content="https://pigeontechies.com/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Pigeon Techies"
    />

    <meta
      property="og:locale"
      content="en_KE"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Pigeon Techies | Web Development & Digital Technology in Kenya"
    />

    <meta
      name="twitter:description"
      content="Modern websites, web applications, software and digital technology solutions by Pigeon Techies."
    />

    <meta
      name="twitter:image"
      content="https://pigeontechies.com/logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="Pigeon Techies"
    />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Pigeon Techies",
        "alternateName": "PigeonTechies",
        "url": "https://pigeontechies.com/",
        "logo": "https://pigeontechies.com/logo.png",
        "description": "Pigeon Techies is a digital technology studio in Kenya creating modern websites, web applications, software and digital solutions.",
        "areaServed": {
          "@type": "Country",
          "name": "Kenya"
        },
        "knowsAbout": [
          "Web Development",
          "Website Design",
          "Software Development",
          "Web Applications",
          "Digital Technology"
        ]
      }
    </script>

    <!-- Website structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pigeon Techies",
        "alternateName": "PigeonTechies",
        "url": "https://pigeontechies.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
